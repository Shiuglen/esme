name: publicar en PyPI

# Publicación de confianza (OIDC): sin tokens de por medio. Al publicar una release (o a mano)
# se sube la rueda a PyPI con la identidad de este repositorio, que PyPI valida contra el
# «pending publisher» que se configura una vez en la cuenta.
#
# Lo que falta para que esto funcione (una vez, en la cuenta de PyPI del creador):
#   1. Crear la cuenta en https://pypi.org/manage/account/ (con 2FA).
#   2. Registrar el proyecto «daimon-esme» en https://pypi.org/manage/project/ y añadir como
#      «pending publisher» el repositorio Shiuglen/esme con el entorno «pypi».
#   3. En GitHub, crear el entorno «pypi» (Settings › Environments) y permitir el despliegue
#      desde la rama que etiquetas.
# A partir de ahí, cada release publica sola. Y la entrada del Registro oficial de MCP
# («io.github.Shiuglen/esme») valida porque el paquete ya existe.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write      # lo que la publicación de confianza necesita
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi   # aquí vive el «pending publisher»
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: construir la rueda
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: comprobaciones antes de subir
        run: |
          python scripts/publicar.py --estado
      - name: subir a PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
